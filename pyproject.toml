[project]
name = "context-memory"
version = "0.1.0"
description = "Generic context-memory ingestion domain contracts"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.0.0",
    "numpy>=1.24.0",
]

[tool.context-memory]
contract-version = "v1"
