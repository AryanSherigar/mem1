[project]
name = "hydradb-hackathon"
version = "0.1.0"
description = "HydraDB Long-Term Memory Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.0.0",
    "uvicorn>=0.30.0",
]

[tool.context-memory]
contract-version = "v1"

[tool.pytest.ini_options]
testpaths = ["src/tests", "src"]
pythonpath = [".", "src"]

