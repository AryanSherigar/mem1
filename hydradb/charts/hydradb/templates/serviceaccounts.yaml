{{- if .Values.node.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hydradb.nodeServiceAccountName" . }}
  labels:
    {{- include "hydradb.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
  {{- with .Values.node.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if and .Values.indexer.enabled .Values.indexer.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hydradb.indexerServiceAccountName" . }}
  labels:
    {{- include "hydradb.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
  {{- with .Values.indexer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
