services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: context_memory
      POSTGRES_USER: context_memory
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_memory -d context_memory"]
      interval: 2s
      timeout: 3s
      retries: 15

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    entrypoint: ["sh", "-c", "mkdir -p /tmp/hydradb/store /tmp/hydradb/cache && echo 'context-memory-local-smoke-token-32b' > /tmp/hydradb/auth-token && exec graph-node"]
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /tmp/hydradb/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /tmp/hydradb/cache
      GRAPH_AUTH_TOKEN_FILE: /tmp/hydradb/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    ports:
      - "127.0.0.1:8080:8443"
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
